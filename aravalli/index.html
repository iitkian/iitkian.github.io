<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aravalli Tiles — z0 start</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { center:[0,0], zoom:0, minZoom:0, maxZoom:12 });
    map.attributionControl.setPrefix('Leaflet'); // or '' to remove entirely

    L.tileLayer('Aravalli/{z}/{x}/{y}.png', {
      minZoom:0, maxZoom:12, minNativeZoom:0, maxNativeZoom:12,
      noWrap:true, tms:false,
      attribution:'ESRI, Dr. Ankur Awadhiya IFS | Generated with QGIS'
    }).addTo(map);
  </script>
</body>
</html>
